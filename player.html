<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foxtel Live</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101116;color:#f4f4f6}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #30313a;display:flex;align-items:center;gap:14px}header strong{font-size:22px}header span{color:#ff805f;font-size:12px;letter-spacing:2px}main{display:grid;grid-template-columns:330px 1fr;max-width:1600px;margin:auto}aside{padding:20px;height:calc(100vh - 76px);overflow:auto;border-right:1px solid #30313a}input,select,button{font:inherit}input,select{width:100%;padding:12px;margin-bottom:10px;background:#1c1d25;color:inherit;border:1px solid #41424f;border-radius:8px}button{cursor:pointer}.channel{display:flex;align-items:center;gap:14px;width:100%;padding:13px 10px;margin:5px 0;border:1px solid transparent;border-radius:10px;background:transparent;color:inherit;text-align:left}.channel:hover,.channel[aria-pressed=true]{background:#25232b;border-color:#ff805f}.channel img{width:64px;height:38px;object-fit:contain}.channel small{display:block;color:#aaa;margin-top:4px}.stage{padding:28px;min-width:0}video{width:100%;max-height:65vh;background:#000;border-radius:12px;aspect-ratio:16/9}h1{font-size:26px;margin-bottom:8px}#status{color:#bbb;line-height:1.6;overflow-wrap:anywhere}.notice{padding:14px;background:#30241f;border:1px solid #a96c46;border-radius:8px;margin-bottom:18px}a{color:#ffac91}.schedule{padding:14px 0;border-bottom:1px solid #30313a;display:flex;gap:16px}.schedule time{color:#ffac91;min-width:90px}#stop{padding:9px 18px;border:1px solid #555;background:#24252f;color:white;border-radius:7px}footer{margin-top:24px;font-size:13px;color:#999}@media(max-width:800px){main{display:flex;flex-direction:column}.stage{order:-1;padding:16px}aside{height:auto;max-height:55vh;border-right:0}header{padding:18px}video{max-height:50vh}}
</style><script defer src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.12/dist/shaka-player.compiled.js"></script><script defer src="/player.js"></script></head>
<body><header><strong>Foxtel Live</strong><span>LIVE TV</span></header><main><aside><label for="search">Find a channel</label><input id="search" type="search" placeholder="Search channels…"><label for="provider">Channels</label><select id="provider"><option value="">All channels</option><option value="freeview">Melbourne Freeview</option><option value="binge">Entertainment &amp; more</option><option value="kayo">Sport</option></select><div id="channels" aria-label="Channels">Loading channels…</div></aside><section class="stage"><div id="notice" class="notice" hidden></div><video id="video" controls playsinline></video><h1 id="title">Your live TV, in the browser</h1><p id="status" role="status" aria-live="polite">Choose a channel to start watching.</p><button id="stop" type="button">Stop playback</button><h2>Coming up</h2><div id="schedule">Select a channel to see its schedule.</div><footer>Playback uses your browser’s Widevine CDM and your subscription. <a href="/foxtel-live.apk">Android TV APK</a> · <a href="/playlist.m3u8">Kodi playlist</a> · <a href="/tivimate.m3u8">TiviMate playlist</a> · <a href="/epg.xml">TV guide</a></footer></section></main></body></html>
